<!-- @dsCard group="Components" viewport="700x230" name="Buttons" subtitle="Button variants/sizes + IconButton" -->
<!DOCTYPE html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-text); padding: 22px; }
  .grp { margin-bottom: 16px; }
  .lbl { font-size: 10px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 9px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.js"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Button, IconButton } = window.FinanzasSebaAppleThemedDesignSystem_4b1b5f;
    const Ico = ({ n, s = 16 }) => <i data-lucide={n} style={{ width: s, height: s, display: "inline-flex" }} />;
    function Demo() {
      return (
        <div>
          <div className="grp">
            <div className="lbl">Variants</div>
            <div className="row">
              <Button variant="primary">Agregar compra</Button>
              <Button variant="secondary">Guardar</Button>
              <Button variant="ghost">Cancelar</Button>
              <Button variant="neutral">Reset</Button>
              <Button variant="primary" disabled>Disabled</Button>
            </div>
          </div>
          <div className="grp">
            <div className="lbl">Sizes · pill</div>
            <div className="row">
              <Button size="sm">Small</Button>
              <Button size="md">Medium</Button>
              <Button size="lg">Large</Button>
              <Button variant="secondary" pill size="sm">Guardado ✓</Button>
            </div>
          </div>
          <div className="grp" style={{ marginBottom: 0 }}>
            <div className="lbl">IconButton</div>
            <div className="row">
              <IconButton label="Atrás"><Ico n="chevron-left" /></IconButton>
              <IconButton label="Adelante"><Ico n="chevron-right" /></IconButton>
              <IconButton variant="surface" label="Salir"><Ico n="log-out" s={15} /></IconButton>
              <IconButton danger label="Eliminar"><Ico n="x" s={15} /></IconButton>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
    setTimeout(() => window.lucide && window.lucide.createIcons(), 60);
  </script>
</body>
</html>
