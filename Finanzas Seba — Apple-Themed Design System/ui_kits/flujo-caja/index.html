<!-- @startingPoint section="Flujo de Caja" subtitle="Full cash-flow dashboard app" viewport="700x800" -->
<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finanzas Seba — Flujo de Caja</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--font-text); font-size: 15px; -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 3px; height: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  input[type=number] { -moz-appearance: textfield; }
  input::-webkit-inner-spin-button, input::-webkit-outer-spin-button { -webkit-appearance: none; }
  input::placeholder { color: var(--muted); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeIn 0.3s ease forwards; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.js"></script>

<script type="text/babel" src="Settings.jsx"></script>
<script type="text/babel" src="CalculadoraTarjeta.jsx"></script>

<script type="text/babel">
// ── App Shell ─────────────────────────────────────────────────────────────
const STORAGE_KEY = "finanzas-seba-v1";

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || null; } catch { return null; }
}
function saveState(s) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch {}
}

const DEFAULT_SETTINGS = {
  theme: "dark", cupoTotal: 3_500_000, limiteMensual: 600_000,
  cupoDisponible: 1_500_000, liquidoMensual: 1_800_000,
  cuotas: window.INIT_CUOTAS,
};

// ── Google Icon ────────────────────────────────────────────────────────────
function GoogleIcon() {
  return (
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908C16.658 14.233 17.64 11.925 17.64 9.2z" fill="#fff" fillOpacity=".9"/>
      <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#fff" fillOpacity=".75"/>
      <path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#fff" fillOpacity=".6"/>
      <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#fff" fillOpacity=".85"/>
    </svg>
  );
}

// ── Login Screen ───────────────────────────────────────────────────────────
function LoginScreen({ onLogin }) {
  const [loading, setLoading] = React.useState(false);
  function handleLogin() {
    setLoading(true);
    setTimeout(() => { setLoading(false); onLogin(); }, 900);
  }
  return (
    <div style={{ minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)" }}>
      <div className="fade-in" style={{ background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius-2xl)",padding:"40px 36px",width:"100%",maxWidth:360,textAlign:"center" }}>
        <div style={{ fontSize:36,marginBottom:16 }}>💳</div>
        <h1 style={{ fontSize:22,fontWeight:700,color:"var(--text)",marginBottom:6,letterSpacing:"-0.03em",fontFamily:"var(--font-display)" }}>Flujo de Caja</h1>
        <p style={{ fontSize:13,color:"var(--muted)",marginBottom:32 }}>Dashboard financiero personal</p>
        <button onClick={handleLogin} disabled={loading} style={{ width:"100%",background:loading?"var(--surface2)":"var(--accent)",color:"#fff",border:"none",borderRadius:"var(--radius-md)",padding:"14px 20px",fontSize:15,fontWeight:600,cursor:loading?"default":"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",gap:10,letterSpacing:"-0.01em",transition:"background 0.2s" }}>
          {loading ? <span style={{ opacity:0.7 }}>Conectando…</span> : <><GoogleIcon />Continuar con Google</>}
        </button>
        <p style={{ fontSize:11,color:"var(--muted)",marginTop:24,opacity:0.5 }}>Acceso restringido · solo uso personal</p>
      </div>
    </div>
  );
}

// ── Nav Bar ────────────────────────────────────────────────────────────────
function NavBar({ section, setSection, theme, setTheme, onLogout }) {
  const tabs = [["tarjeta","Tarjeta"],["forecast","Forecast"],["settings","Config"]];
  return (
    <div style={{ position:"sticky",top:0,zIndex:50,background:"var(--glass-bg)",backdropFilter:"var(--glass-blur)",WebkitBackdropFilter:"var(--glass-blur)",borderBottom:"1px solid var(--border)" }}>
      <div style={{ maxWidth:700,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 20px",gap:12 }}>
        {/* Brand */}
        <div style={{ display:"flex",alignItems:"center",gap:8,flexShrink:0 }}>
          <span style={{ width:7,height:7,background:"var(--accent)",borderRadius:"50%",display:"inline-block" }} />
          <span style={{ fontSize:13,fontWeight:600,color:"var(--secondary)",letterSpacing:"-0.01em" }}>Finanzas Seba</span>
        </div>
        {/* Tabs */}
        <div style={{ display:"flex",gap:2,background:"var(--surface)",borderRadius:"var(--radius-md)",padding:3 }}>
          {tabs.map(([id,label])=>(
            <button key={id} onClick={()=>setSection(id)}
              style={{ padding:"6px 16px",borderRadius:"var(--radius-sm)",border:"none",background:section===id?"var(--surface2)":"transparent",color:section===id?"var(--text)":"var(--secondary)",fontFamily:"inherit",fontSize:13,fontWeight:500,cursor:"pointer",transition:"background 0.15s,color 0.15s",letterSpacing:"-0.01em",whiteSpace:"nowrap" }}>
              {label}
            </button>
          ))}
        </div>
        {/* Right */}
        <div style={{ display:"flex",alignItems:"center",gap:4,flexShrink:0 }}>
          <div style={{ display:"flex",gap:2,background:"var(--surface)",borderRadius:"var(--radius-sm)",padding:2,marginRight:4 }}>
            {[["light","☀"],["dark","☾"]].map(([t,icon])=>(
              <button key={t} onClick={()=>setTheme(t)}
                style={{ width:28,height:28,borderRadius:"var(--radius-xs)",border:"none",background:theme===t?"var(--surface2)":"transparent",color:theme===t?"var(--text)":"var(--muted)",cursor:"pointer",fontSize:13,transition:"background 0.15s,color 0.15s",display:"flex",alignItems:"center",justifyContent:"center" }}>
                {icon}
              </button>
            ))}
          </div>
          <button onClick={onLogout} title="Cerrar sesión"
            style={{ background:"transparent",border:"none",color:"var(--muted)",cursor:"pointer",width:32,height:32,borderRadius:"var(--radius-sm)",display:"flex",alignItems:"center",justifyContent:"center",transition:"background 0.15s,color 0.15s" }}>
            <i data-lucide="log-out" style={{ width:15,height:15 }} />
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Bottom Tab Bar (mobile) ────────────────────────────────────────────────
function BottomNav({ section, setSection }) {
  const tabs = [["tarjeta","Tarjeta","credit-card"],["forecast","Forecast","bar-chart-2"],["settings","Config","settings-2"]];
  return (
    <nav style={{ display:"none",position:"fixed",bottom:0,left:0,right:0,background:"var(--surface)",borderTop:"1px solid var(--border)",padding:"8px 0",zIndex:100,paddingBottom:"max(8px,env(safe-area-inset-bottom))" }}>
      {tabs.map(([id,label,icon])=>(
        <button key={id} onClick={()=>setSection(id)}
          style={{ flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4,background:"transparent",border:"none",cursor:"pointer",fontFamily:"inherit",fontSize:10,fontWeight:500,color:section===id?"var(--accent)":"var(--muted)",padding:"4px 0",transition:"color 0.15s" }}>
          <i data-lucide={icon} style={{ width:20,height:20 }} />
          <span>{label}</span>
        </button>
      ))}
    </nav>
  );
}

// ── Forecast Section (simple) ──────────────────────────────────────────────
function ForecastSection({ liquidoMensual }) {
  const fmt = (n) => (n/1000).toFixed(0)+"k";
  const scenarios = [
    { label:"Conservador", ahorro: Math.round(liquidoMensual * 0.12), color:"var(--yellow)" },
    { label:"Estándar",    ahorro: Math.round(liquidoMensual * 0.20), color:"var(--accent)" },
    { label:"Agresivo",    ahorro: Math.round(liquidoMensual * 0.32), color:"var(--green)"  },
  ];
  return (
    <div>
      <div style={{ marginBottom:28 }}>
        <div style={{ fontSize:11,fontWeight:500,color:"var(--muted)",marginBottom:8,letterSpacing:"0.02em" }}>Seba Nava · Plutto · 2026</div>
        <h1 style={{ fontSize:32,fontWeight:700,letterSpacing:"-0.03em",marginBottom:10,fontFamily:"var(--font-display)" }}>Forecast personal</h1>
        <div style={{ display:"flex",gap:8,flexWrap:"wrap",marginBottom:6 }}>
          <span style={{ background:"var(--badge-bg)",color:"var(--badge-text)",borderRadius:"var(--radius-pill)",padding:"3px 12px",fontSize:11,fontWeight:600 }}>Implementation Engineer</span>
          <span style={{ background:"rgba(48,209,88,0.12)",color:"var(--green)",borderRadius:"var(--radius-pill)",padding:"3px 12px",fontSize:11,fontWeight:600 }}>Aceptado</span>
        </div>
        <div style={{ color:"var(--muted)",fontSize:12 }}>Peñalolén · sin arriendo · ${fmt(liquidoMensual)} líquido</div>
      </div>

      <div style={{ fontSize:11,fontWeight:600,color:"var(--muted)",letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:10 }}>Ahorro mensual proyectado</div>
      <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:24 }}>
        {scenarios.map(({label,ahorro,color})=>(
          <div key={label} style={{ background:"var(--surface)",borderRadius:"var(--radius-lg)",padding:"18px 16px" }}>
            <div style={{ fontSize:11,color:"var(--muted)",marginBottom:6 }}>{label}</div>
            <div style={{ fontSize:20,fontWeight:700,letterSpacing:"-0.02em",fontVariantNumeric:"tabular-nums",color }}>
              ${Math.round(ahorro/1000)}k
            </div>
            <div style={{ height:2,background:"var(--surface2)",borderRadius:"var(--radius-pill)",overflow:"hidden",marginTop:10 }}>
              <div style={{ height:"100%",width:`${Math.round(ahorro/liquidoMensual*100)}%`,background:color,borderRadius:"var(--radius-pill)" }} />
            </div>
          </div>
        ))}
      </div>

      <div style={{ fontSize:11,fontWeight:600,color:"var(--muted)",letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:10 }}>Proyección 5 años</div>
      <div style={{ background:"var(--surface)",borderRadius:"var(--radius-xl)",padding:"20px 22px" }}>
        {[1,2,3,5].map(years=>{
          const ahorro = Math.round(liquidoMensual * 0.20) * 12 * years;
          return (
            <div key={years} style={{ display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:years===5?"none":"1px solid var(--border)" }}>
              <span style={{ fontSize:13,color:"var(--secondary)" }}>Año {years}</span>
              <span style={{ fontSize:15,fontWeight:600,fontVariantNumeric:"tabular-nums",color:"var(--accent)" }}>
                ${Math.round(ahorro/1_000_000*10)/10}M
              </span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── Main App ───────────────────────────────────────────────────────────────
function App() {
  const saved = loadState();
  const [loggedIn, setLoggedIn] = React.useState(false);
  const [section, setSection] = React.useState("tarjeta");
  const [settings, setSettings] = React.useState(saved || DEFAULT_SETTINGS);

  React.useEffect(() => {
    document.documentElement.setAttribute("data-theme", settings.theme);
  }, [settings.theme]);

  React.useEffect(() => { saveState(settings); }, [settings]);

  function updateSettings(patch) { setSettings(s => ({ ...s, ...patch })); }
  function setTheme(t) { updateSettings({ theme: t }); }
  function handleLogout() { setLoggedIn(false); setSection("tarjeta"); }

  React.useEffect(() => {
    if (window.lucide) window.lucide.createIcons();
  });

  if (!loggedIn) return <LoginScreen onLogin={() => setLoggedIn(true)} />;

  return (
    <div style={{ minHeight:"100vh",background:"var(--bg)",position:"relative" }}>
      <NavBar section={section} setSection={setSection} theme={settings.theme} setTheme={setTheme} onLogout={handleLogout} />
      <div style={{ maxWidth:700,margin:"0 auto",padding:"0 20px 100px" }}>
        <main style={{ paddingTop:28 }} className="fade-in" key={section}>
          {section === "tarjeta" && (
            <UICalculadora
              cupoTotal={settings.cupoTotal}
              limiteMensual={settings.limiteMensual}
              initialCuotas={settings.cuotas}
              initialCupo={settings.cupoDisponible}
              onCuotasChange={(c) => updateSettings({ cuotas: c })}
              onCupoChange={(v) => updateSettings({ cupoDisponible: v })}
              onLimiteChange={(v) => updateSettings({ limiteMensual: v })}
            />
          )}
          {section === "forecast" && <ForecastSection liquidoMensual={settings.liquidoMensual} />}
          {section === "settings" && <UISettings settings={settings} onUpdate={updateSettings} />}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<style>
  @media (max-width: 640px) {
    nav[style*="fixed"] { display: flex !important; }
  }
</style>
</body>
</html>
