<!DOCTYPE html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-text); padding: 24px; }
  .r { display: flex; align-items: baseline; gap: 14px; margin-bottom: 11px; }
  .tag { width: 130px; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; flex-shrink: 0; }
  .eyebrow { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .heading { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .body { font-size: 15px; font-weight: 400; }
  .label { font-size: 13px; font-weight: 500; color: var(--secondary); }
  .meta { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
  <div class="r"><div class="tag">eyebrow · 11/600</div><div class="eyebrow">Tarjeta de crédito</div></div>
  <div class="r"><div class="tag">heading · 22/700</div><div class="heading">Configuración</div></div>
  <div class="r"><div class="tag">body · 15/400</div><div class="body">Dashboard financiero personal</div></div>
  <div class="r"><div class="tag">label · 13/500</div><div class="label">Límite mensual deseado</div></div>
  <div class="r"><div class="tag">meta · 11/400</div><div class="meta">Solo locales · no se envían a ningún servidor</div></div>
</body>
</html>
