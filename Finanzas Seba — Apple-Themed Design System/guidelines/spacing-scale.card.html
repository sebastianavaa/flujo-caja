<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="8px-based rhythm with dense half-steps" -->
<!DOCTYPE html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-text); padding: 24px; }
  .row { display: flex; gap: 18px; align-items: flex-end; }
  .col { text-align: center; }
  .bar { background: var(--accent); border-radius: 3px; width: 22px; margin: 0 auto; }
  .l { font-size: 10px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .n { font-size: 10px; color: var(--secondary); margin-top: 1px; }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="bar" style="height:4px"></div><div class="l">4</div><div class="n">space-2</div></div>
    <div class="col"><div class="bar" style="height:8px"></div><div class="l">8</div><div class="n">space-4</div></div>
    <div class="col"><div class="bar" style="height:12px"></div><div class="l">12</div><div class="n">space-6</div></div>
    <div class="col"><div class="bar" style="height:16px"></div><div class="l">16</div><div class="n">space-8</div></div>
    <div class="col"><div class="bar" style="height:20px"></div><div class="l">20</div><div class="n">space-10</div></div>
    <div class="col"><div class="bar" style="height:24px"></div><div class="l">24</div><div class="n">space-12</div></div>
    <div class="col"><div class="bar" style="height:28px"></div><div class="l">28</div><div class="n">space-14</div></div>
    <div class="col"><div class="bar" style="height:32px"></div><div class="l">32</div><div class="n">space-16</div></div>
    <div class="col"><div class="bar" style="height:40px"></div><div class="l">40</div><div class="n">space-20</div></div>
  </div>
</body>
</html>
