<!DOCTYPE html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-text); padding: 22px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; }
  .chip { height: 60px; border-radius: var(--radius-md); }
  .name { font-size: 12px; font-weight: 600; margin-top: 8px; letter-spacing: -0.01em; }
  .hex { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--green)"></div><div class="name">green · OK</div><div class="hex">#30d158</div></div>
    <div class="sw"><div class="chip" style="background:var(--yellow)"></div><div class="name">yellow · atención</div><div class="hex">#ffd60a</div></div>
    <div class="sw"><div class="chip" style="background:var(--orange)"></div><div class="name">orange</div><div class="hex">#ff9f0a</div></div>
    <div class="sw"><div class="chip" style="background:var(--red)"></div><div class="name">red · excede</div><div class="hex">#ff453a</div></div>
  </div>
</body>
</html>
