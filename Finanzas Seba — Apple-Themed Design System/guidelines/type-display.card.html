<!-- @dsCard group="Type" viewport="700x190" name="Display — SF Pro Display" subtitle="Tight tracking, large titles & figures" -->
<!DOCTYPE html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-display); padding: 24px; }
  .eyebrow { font-size: 11px; font-weight: 500; color: var(--accent); letter-spacing: 0.04em; margin-bottom: 8px; font-family: var(--font-text); }
  .h1 { font-size: 40px; font-weight: 700; line-height: 1.05; letter-spacing: -0.03em; }
  .hero { font-size: 54px; font-weight: 300; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .meta { font-size: 11px; color: var(--muted); font-family: var(--font-text); margin-top: 10px; }
</style>
</head>
<body>
  <div class="eyebrow">CONTROL FINANCIERO</div>
  <div class="h1">Facturación <span style="color:var(--accent)">Tarjeta</span></div>
  <div class="hero"><span style="font-size:0.42em;color:var(--secondary);vertical-align:super">$</span>1.737.000</div>
  <div class="meta">font-display · 700 / 300 · tracking −0.03 to −0.04em</div>
</body>
</html>
