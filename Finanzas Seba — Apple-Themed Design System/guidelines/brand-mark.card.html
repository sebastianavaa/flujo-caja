<!-- @dsCard group="Brand" viewport="700x200" name="Brand mark — Finanzas Seba" subtitle="Accent dot + wordmark, light & dark" -->
<!DOCTYPE html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-text); display: flex; }
  .half { flex: 1; padding: 30px 28px; box-sizing: border-box; }
  .dark { background: #000; }
  .light { background: #f5f5f7; }
  .brand { display: flex; align-items: center; gap: 9px; margin-bottom: 18px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .name { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .wordmark { font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
  .sub { font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
  <div class="half dark">
    <div class="brand"><span class="dot" style="background:#2997ff"></span><span class="name" style="color:#86868b">Finanzas Seba</span></div>
    <div class="wordmark" style="color:#f5f5f7">Flujo de <span style="color:#2997ff">Caja</span></div>
    <div class="sub" style="color:#86868b">Dashboard financiero personal</div>
  </div>
  <div class="half light">
    <div class="brand"><span class="dot" style="background:#0071e3"></span><span class="name" style="color:#6e6e73">Finanzas Seba</span></div>
    <div class="wordmark" style="color:#1d1d1f">Flujo de <span style="color:#0071e3">Caja</span></div>
    <div class="sub" style="color:#6e6e73">Dashboard financiero personal</div>
  </div>
</body>
</html>
