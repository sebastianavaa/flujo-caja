<!-- @dsCard group="Colors" viewport="700x176" name="Accent — Apple Blue" subtitle="Web blue accent + hover / pressed / tinted fills" -->
<!DOCTYPE html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-text); padding: 22px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; }
  .chip { height: 60px; border-radius: var(--radius-md); display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box; }
  .name { font-size: 12px; font-weight: 600; margin-top: 8px; letter-spacing: -0.01em; }
  .hex { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw">
      <div class="chip" style="background:var(--accent)"><span style="color:#fff;font-size:11px;font-weight:600">Aa</span></div>
      <div class="name">accent</div><div class="hex">#2997ff</div>
    </div>
    <div class="sw">
      <div class="chip" style="background:var(--accent-hover)"></div>
      <div class="name">accent-hover</div><div class="hex">#47a3ff</div>
    </div>
    <div class="sw">
      <div class="chip" style="background:var(--accent-pressed)"></div>
      <div class="name">accent-pressed</div><div class="hex">#0077ed</div>
    </div>
    <div class="sw">
      <div class="chip" style="background:var(--accent-soft);border:1px solid var(--accent-soft-border)"><span style="color:var(--accent);font-size:11px;font-weight:600">soft</span></div>
      <div class="name">accent-soft</div><div class="hex">14% tint</div>
    </div>
  </div>
</body>
</html>
