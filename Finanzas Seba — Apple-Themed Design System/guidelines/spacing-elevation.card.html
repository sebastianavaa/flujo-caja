<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation & glass" subtitle="Soft low-contrast shadows + frosted chrome" -->
<!DOCTYPE html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-text); padding: 28px 24px; }
  .row { display: flex; gap: 26px; align-items: center; }
  .col { text-align: center; }
  .box { width: 110px; height: 64px; background: var(--surface); border-radius: var(--radius-lg); }
  .l { font-size: 11px; font-weight: 600; margin-top: 12px; }
  .n { font-size: 10px; color: var(--muted); margin-top: 1px; }
  .glass { width: 110px; height: 64px; border-radius: var(--radius-lg); background: var(--glass-bg); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); border: 1px solid var(--border); display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--secondary); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="l">shadow-sm</div><div class="n">toggles, chips</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="l">shadow-md</div><div class="n">popovers</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="l">shadow-lg</div><div class="n">modals</div></div>
    <div class="col"><div class="glass">backdrop-blur</div><div class="l">glass</div><div class="n">sticky nav</div></div>
  </div>
</body>
</html>
