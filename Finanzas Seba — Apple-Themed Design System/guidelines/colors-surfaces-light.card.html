<!DOCTYPE html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-text); padding: 22px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; }
  .chip { height: 60px; border-radius: var(--radius-md); border: 1px solid var(--border); }
  .name { font-size: 12px; font-weight: 600; margin-top: 8px; letter-spacing: -0.01em; }
  .hex { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--bg-main)"></div><div class="name">bg-main</div><div class="hex">#f5f5f7</div></div>
    <div class="sw"><div class="chip" style="background:var(--bg-card)"></div><div class="name">bg-card</div><div class="hex">#ffffff</div></div>
    <div class="sw"><div class="chip" style="background:var(--bg-element)"></div><div class="name">bg-element</div><div class="hex">#f5f5f7</div></div>
    <div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="name">accent</div><div class="hex">#0071e3</div></div>
  </div>
</body>
</html>
